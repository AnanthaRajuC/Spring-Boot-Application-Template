# Docker compose file reference (https://docs.docker.com/compose/compose-file/)
#
# Usage:
#   export DB_PASSWORD=... DB_ROOT_PASSWORD=... JWT_KEY_STORE_PASSWORD=... REMEMBER_ME_KEY=...
#   docker compose up --build
#
# The JWT signing key store is mounted from ./secrets/jwt.p12, see README for how to create it.

services:
  # MySQL Database for the application
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sbat
      MYSQL_USER: sbat
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - sbat-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  # Back-end spring boot application with UI
  app:
    build: .
    image: spring-boot-application-template:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: db
      DB_DATABASE: sbat
      DB_USERNAME: sbat
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      JWT_KEY_STORE: file:/run/secrets/jwt.p12
      JWT_KEY_STORE_PASSWORD: ${JWT_KEY_STORE_PASSWORD:?set JWT_KEY_STORE_PASSWORD}
      JWT_KEY_ALIAS: ${JWT_KEY_ALIAS:-sbat}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:?set REMEMBER_ME_KEY}
      # Plain HTTP on localhost; set to true behind TLS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ./secrets/jwt.p12:/run/secrets/jwt.p12:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  sbat-data:
