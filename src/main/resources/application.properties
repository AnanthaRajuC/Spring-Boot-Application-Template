# Common application properties, shared by every profile.
# Profile specific files (application-<profile>.properties) only hold what differs.
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html

# Default profile: in-memory H2 database, no external services needed.
spring.profiles.default=test

# Optional local overrides, e.g. MAIL_USERNAME=... or DB_PASSWORD=..., in a git-ignored .env file.
spring.config.import=optional:file:.env[.properties]

spring.application.name=Spring-Boot-Application-Template
app.description=${spring.application.name} is a skeleton of a typical spring boot app that can be used to bootstrap a simple app quickly.

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8

# Configuring API version and the default API key sent back in responses.
release.version=3.1.3
api.version=2020-09-20
api.key=

# -------------------------------------------------------------------------------------------------------------
# SERVER PROPERTIES
# -------------------------------------------------------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
# Trust X-Forwarded-* headers only when running behind a proxy that sets them.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# SSL is off by default. To enable it, point these at your own key store (never commit it).
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# -------------------------------------------------------------------------------------------------------------
# SECURITY PROPERTIES
# -------------------------------------------------------------------------------------------------------------
# Key store holding the RSA key pair used to sign JWTs. When unset, an ephemeral key pair is generated at
# startup: fine for local development, but tokens stop working after a restart. Always set it in production.
sbat.security.jwt.key-store=${JWT_KEY_STORE:}
sbat.security.jwt.key-store-password=${JWT_KEY_STORE_PASSWORD:}
sbat.security.jwt.key-alias=${JWT_KEY_ALIAS:sbat}
sbat.security.jwt.issuer=${spring.application.name}
sbat.security.refresh-token-validity=7d
# Secret used to sign remember-me cookies. When unset, a random key is generated at startup.
sbat.security.remember-me-key=${REMEMBER_ME_KEY:}
# Failed login attempts allowed per client IP before it is blocked, and for how long.
sbat.security.max-login-attempts=5
sbat.security.login-block-duration=15m

# -------------------------------------------------------------------------------------------------------------
# DATA PROPERTIES
# -------------------------------------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:/data/mysql/migrations

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=500
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# MySQL connection, overridable through environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:sbat}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:sbat}
spring.datasource.password=${DB_PASSWORD:}
# The MySQL schema uses camelCase column names for the user account flags.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -------------------------------------------------------------------------------------------------------------
# MAIL PROPERTIES
# -------------------------------------------------------------------------------------------------------------
# https://mailtrap.io/ provides a free smtp sandbox.
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.body=Thank you for signing up to SBAT. Please click on the below url to activate your account : ${sbat.base-url}/api/v1/auth/verification/
sbat.base-url=${BASE_URL:http://localhost:${server.port}}

# -------------------------------------------------------------------------------------------------------------
# SITE PROPERTIES (shown on the home page)
# -------------------------------------------------------------------------------------------------------------
sbat.site.logo=${SITE_LOGO:/images/map.svg}
sbat.site.initials=${SITE_INITIALS:SBAT}
sbat.site.title=${SITE_TITLE:Spring Boot Application Template}
sbat.site.description=${SITE_DESCRIPTION:A repo you can fork with everything already set up to speed up the creation of new Spring Boot based web applications, just fork-and-code.}

# -------------------------------------------------------------------------------------------------------------
# TEMPLATING PROPERTIES
# -------------------------------------------------------------------------------------------------------------
spring.thymeleaf.cache=true

# -------------------------------------------------------------------------------------------------------------
# API DOCUMENTATION (springdoc-openapi)
# -------------------------------------------------------------------------------------------------------------
# Swagger UI: /swagger-ui.html, OpenAPI document: /v3/api-docs
springdoc.packages-to-scan=io.github.anantharajuc.sbat

# -------------------------------------------------------------------------------------------------------------
# CORE PROPERTIES
# -------------------------------------------------------------------------------------------------------------
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

info.build.groupId=@project.groupId@
info.build.artifact=@project.artifactId@
info.build.version=@project.version@
info.build.packaging=@project.packaging@
info.build.name=@project.name@
management.info.java.enabled=true

logging.level.root=info
logging.level.org.springframework.web=warn
logging.file.name=./logs/${spring.application.name}.log

spring.main.banner-mode=console

# -------------------------------------------------------------------------------------------------------------
# ACTUATOR PROPERTIES
# -------------------------------------------------------------------------------------------------------------
# health and info are public; every other endpoint requires ROLE_ADMIN (see ApplicationSecurityConfiguration).
management.endpoints.web.exposure.include=health,info,prometheus,metrics,customActuatorEndpoint
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# An unreachable SMTP server should not mark the whole application as down.
management.health.mail.enabled=false
