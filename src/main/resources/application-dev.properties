# DEV profile: MySQL database configured through DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME and DB_PASSWORD.
spring.application.name=Spring-Boot-Application-Template_DEV

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:sbat_dev}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:sbat_dev}

spring.jpa.show-sql=true
spring.thymeleaf.cache=false
spring.jpa.properties.hibernate.format_sql=true
