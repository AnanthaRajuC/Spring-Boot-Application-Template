# Local / test profile (the default): in-memory H2 database seeded by Flyway, H2 console enabled.
spring.application.name=Spring-Boot-Application-Template

spring.flyway.locations=classpath:/data/h2db/migrations

# DATABASE_TO_LOWER keeps identifiers lower case like MySQL; NON_KEYWORDS allows the `user` table name.
spring.datasource.url=jdbc:h2:mem:sbat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# The H2 schema uses snake_case column names.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# H2 web console at /h2-console, only reachable from localhost.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.thymeleaf.cache=false
