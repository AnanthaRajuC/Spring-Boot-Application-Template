# STAGING profile: MySQL database configured through DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME and DB_PASSWORD.
spring.application.name=Spring-Boot-Application-Template_STAGING

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:sbat_staging}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:sbat_staging}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
