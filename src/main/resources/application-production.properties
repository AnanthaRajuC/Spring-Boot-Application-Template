# PRODUCTION profile: MySQL database configured through DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME and DB_PASSWORD.
# Also set JWT_KEY_STORE, JWT_KEY_STORE_PASSWORD, JWT_KEY_ALIAS and REMEMBER_ME_KEY, see README.
spring.application.name=Spring-Boot-Application-Template_PROD

# API documentation is not published in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
